{id:'SB',name:'Community Kitchen B',loc:'Kalyani Nagar',x:14.2,y:6,demand:{'Cooked meals':80,'Ration kits':60,'Infant formula':20},cap:400,inv:150,res:['water','fuel','fridge','prep'],st:'Open',urg:2},
{id:'SC',name:'Relief Camp C',loc:'Hadapsar',x:16.5,y:10.1,demand:{'Cooked meals':50,'Hygiene kits':40,'Ration kits':50},cap:250,inv:90,res:['water'],st:'Open',urg:3},

function atRisk(){const r=S.asg.filter(a=>live(a)&&rk(a)!='green');return tbl(['ID','Aid','Qty','Rider','Shelter','ETA','Expiry in','Status','Risk',''],r.map(a=>{const b=B_(a.batchId),rd=R_(a.riderId||a.sug),p=['Picked Up','In Transit'].includes(a.status);return[a.id,b.type,a.qty,rd?rd.name:'—',Sh(a.shelterId).name,rd?fm(now+etaC(rd,b,Sh(a.shelterId),p)):'—',rem(b.exp-now),a.status,rb(rk(a)),bt('rdlg',a.id,'Reassign','d')]}))}

rdlg:i=>{const a=A_(i),b=B_(a.batchId),s=Sh(a.shelterId),rs=S.riders.filter(r=>r.av=='Available'&&!r.cur),ss=S.shelters.filter(x=>compat(b,x).k!='no'&&free(x,b.type)>=a.qty);
modal(`<h3>Reassign ${a.id}</h3><p>Current: ${a.qty} ${b.unit} → ${s.name}, rider ${a.riderId||'unassigned'}, ${a.status}. Reason: ${NOREC.includes(s.st)?'shelter unavailable':a.flag?'rider unresponsive':rk(a)=='red'?'unsafe route':'manual'}</p><label for="rr1">Backup rider</label><select id="rr1">${rs.map(r=>`<option value="${r.id}">${r.name} (${r.rel}%)</option>`).join('')||'<option value="">None available</option>'}</select><label for="rs1">Compatible backup shelter</label><select id="rs1">${ss.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')||'<option value="">None compatible</option>'}</select><p>New risk is recalculated after confirming.</p><button class="btn d" data-a="rok" data-id="${a.id}">Confirm reassignment</button>`)},
rok:i=>{const r=$('#rr1').value,s=$('#rs1').value;if(!s){toast('No compatible shelter available','crit');return}reassign(i,r,s);modal('')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!ACT[el.dataset.a])return;ACT[el.dataset.a](el.dataset.id);if(el.dataset.a!='adlg'&&el.dataset.a!='rdlg')draw()});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;if(c=='lang')lang=v;if(c=='role'){role=v;page='overview'}if(c=='q')q=v;if(c=='shst')setShelter(e.target.dataset.id,v);draw()});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.dataset.f,d=new FormData(e.target),g=k=>d.get(k),set=(i,m)=>{const x=$('#'+i);if(x)x.textContent=m};
if(f=='login'){const em=g('em').trim(),pw=g('pw'),v=valEmail(em);set('eem',v);set('epw',pw?'':'Password is required.');set('eall','');if(v||!pw)return;const b=$('#sub');b.disabled=true;b.textContent='Signing in...';
try{const u=await Auth.login(em,pw);Auth.set(u,!!g('rm'));role=u.role;page='overview';location.hash='#/app'}catch(x){draw();$('#em').value=em;set('eall',x.message||'Please check your email and password.')}}
if(f=='forgot'){const v=valEmail(g('em').trim());set('eem',v);if(v)return;set('fok','Sending...');setTimeout(()=>set('fok','If an account exists for this email, password reset instructions have been sent.'),700)}
if(f=='reg'){const v=valEmail(g('em').trim());if(!g('nm').trim()||v||!g('pw')||g('pw').length<6)return set('eall',v||'Enter your name and a password of at least 6 characters.');const u={email:g('em').trim().toLowerCase(),pw:g('pw'),role:g('rl'),name:g('nm')};USERS.push(u);Auth.set(u,false);role=u.role;location.hash='#/app'}
if(f=='don'){const qy=+g('qty'),ex=+g('exp');set('e2',qy>0?'':'Quantity must be greater than 0.');set('e6',ex>0?'':'Expiry must be in the future.');if(qy<=0||ex<=0)return;
const b={id:'B-'+nB++,donor:g('donor'),type:g('type'),qty:qy,unit:g('unit')||'units',created:now,exp:now+ex,store:g('store'),urg:g('urg'),req:d.getAll('req'),wt:+g('wt'),vol:+g('vol'),ready:now+(+g('ready'))};S.batches.unshift(b);
log(`New donation batch ${b.id}: ${qy} ${b.unit} ${b.type} from ${Dn(b.donor).name}`,{sev:'info',b:b.id,type:'Created',actor:Dn(b.donor).name});selB=b.id;plan=mkPlan(b);toast(`Batch ${b.id} created – ${plan.need} riders, ${plan.loads.length} suggested loads`,'ok');draw()}
if(f=='dem'){const s=Sh(g('sid')),qy=+g('qty'),cap=+g('cap'),inv=+g('inv');if(qy<=0||cap<=0||inv<0||inv>cap)return set('em','Enter positive quantity/capacity; inventory cannot exceed capacity.');
if(qy>cap-inv)toast('Warning: demand exceeds remaining storage capacity','warn');s.demand[g('type')]=qy;s.inv=inv;s.cap=cap;s.urg=+g('urg');s.res=d.getAll('res');log(`${s.name} published demand: ${qy} ${g('type')}`,{type:'Demand',actor:s.name});toast('Demand published','ok');draw()}});
seed();draw();setInterval(tick,10000);
</script></body></html>
